name: Read-only mainnet smoke
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, 'feat/**']
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  production-and-upstreams:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/verification/mainnet-smoke.mjs
